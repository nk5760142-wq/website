<!DOCTYPE html>
<html>

<head>
    <title>My Promises to Jithu 💗</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hearts">💗 💕 💗 💕 💗</div>

    <h1>My Promises to You, Jithu 💗</h1>

    <p>I have a few little promises for you... 🥹</p>

<button class="Promise-button" onclick="showPromise(1)">Promise 1 💌</button>
<button class="Promise-button"onclick="showPromise(2)">Promise 2 🌷</button>
<button class="Promise-button"onclick="showPromise(3)">Promise 3 🫶</button>
<button class="Promise-button"onclick="showPromise(4)">Promise 4 ⭐</button>
<button class="Promise-button"onclick="showPromise(5)">Promise 5 💖</button>

<button class="Promise-button"onclick="showPromise(6)">Promise 6 🥹</button>
<button class="Promise-button"onclick="showPromise(7)">Promise 7 🌸</button>
<button class="Promise-button"onclick="showPromise(8)">Promise 8 💕</button>
<button class="Promise-button"onclick="showPromise(9)">Promise 9 🪽</button>
<button class="Promise-button"onclick="showPromise(10)">Promise 10 💗</button>

<p id="promiseText"></p>
<script>

function showPromise(number) {

    let message = "";

    if (number == 1) {
        message = "I promise to always support you. ❤️";
    }

    if (number == 2) {
        message = "I promise to listen to you, even when you are being annoying. 😂💗";
    }

    if (number == 3) {
        message = "I promise to celebrate your little achievements with you. 🥹";
    }

    if (number == 4) {
        message = "I promise to make more beautiful memories with you. 🫶";
    }

    if (number == 5) {
        message = "I promise to always be there for you. 💕";
    }

    if (number == 6) {
        message = "I promise to make you smile whenever I can. 😚";
    }

    if (number == 7) {
        message = "I promise to respect you and understand you. 🌸";
    }

    if (number == 8) {
        message = "I promise to never take our special moments for granted. 💗";
    }

    if (number == 9) {
        message = "I promise to keep making memories with you. 🪽";
    }

    if (number == 10) {
        message = "I promise to keep choosing you. Always. ❤️";
    }

    document.getElementById("promiseText").innerHTML = message;
}

</script>
<br><br>

<button onclick="openMemories()">
    📸 Our Memories
</button>

<script>
function openMemories() {
    window.location.href = "memories.html";
}
</script>
</body>

</html>
